license="${mod_license}"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

description='''
In-game mail: any mod can send a player a letter (to/from, a message, up to 9 item attachments)
that's guaranteed to be there the next time that player is online, whether or not they're online
right now. Exposes a public API (api.Coryspondance) so other mods can send mail; players read and
claim their own mail through an in-game mailbox UI.
'''

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
